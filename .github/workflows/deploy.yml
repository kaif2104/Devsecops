name: DevSecOps Security & Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: BUILD & UNIT TESTING
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/ProductAPI.csproj

      - name: Build Backend
        run: dotnet build backend/ProductAPI.csproj --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test backend/ProductAPI.Tests/ProductAPI.Tests.csproj --verbosity normal

  # ---------------------------------------------------------------------------
  # STAGE 2: SECURITY SCANNING & SECURITY GATE
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security Scans (SCA, Secret Scan, SAST)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Gitleaks & Semgrep
        run: |
          echo ">> Installing Gitleaks..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          
          echo ">> Installing Semgrep..."
          python3 -m pip install semgrep

      - name: Execute Security Gate Scans
        run: |
          chmod +x security/scan.sh
          ./security/scan.sh

  # ---------------------------------------------------------------------------
  # STAGE 3: DEPLOYMENT TO AWS EC2 (BLUE/GREEN)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Release Binaries
        run: |
          mkdir -p build-output/backend
          dotnet publish backend/ProductAPI.csproj -c Release -o ./build-output/backend

      - name: Configure SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to EC2 & Health Check
        env:
          WEB_SERVER_IP: ${{ secrets.WEB_SERVER_IP }}
          WEB_SERVER_USER: ${{ secrets.WEB_SERVER_USER || 'ubuntu' }}
        run: |
          if [ -z "$WEB_SERVER_IP" ]; then
            echo "::warning ::WEB_SERVER_IP secret not set. Skipping live SSH deployment step."
            exit 0
          fi
          
          echo ">> Executing Remote Deployment to $WEB_SERVER_IP..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${WEB_SERVER_USER}@${WEB_SERVER_IP} "pg_isready -h localhost -p 5432" || exit 1
          
          # Target blue/green slot check and sync
          ACTIVE_ENV=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${WEB_SERVER_USER}@${WEB_SERVER_IP} 'cat /var/www/active_env.txt 2>/dev/null | grep -o "blue\|green" || echo "blue"')
          TARGET_ENV=$([ "$ACTIVE_ENV" = "blue" ] && echo "green" || echo "blue")
          TARGET_PORT=$([ "$TARGET_ENV" = "green" ] && echo "5002" || echo "5001")
          
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r ./build-output/backend/* ${WEB_SERVER_USER}@${WEB_SERVER_IP}:/var/www/${TARGET_ENV}/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${WEB_SERVER_USER}@${WEB_SERVER_IP} "sudo systemctl restart productapi-${TARGET_ENV}"
          
          # Health probe
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${WEB_SERVER_USER}@${WEB_SERVER_IP} "/usr/local/bin/monitoring/health-check.sh http://127.0.0.1:${TARGET_PORT}/health"
          
          # Switch Traffic
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${WEB_SERVER_USER}@${WEB_SERVER_IP} "sudo /usr/local/bin/switch-traffic.sh ${TARGET_ENV}"
